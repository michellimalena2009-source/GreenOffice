<script>
const TIPOS = ["Fit", "Equilibrado", "Vegetariano", "Vegano", "Sin TACC"];
const MENU = {
  "Fit": [
    ["Bowl de quinoa y salmón", 30, 30, 15, 25],
    ["Pollo al limón con puré de camote", 35, 30, 10, 25],
    ["Wrap integral de pavo", 30, 35, 10, 25]
  ],
  "Equilibrado": [
    ["Pechuga grillada con cuscús y vegetales", 25, 35, 10, 30],
    ["Penne rigate con pollo y cherrys", 25, 40, 15, 20],
    ["Pastel de carne magra y calabaza", 25, 30, 15, 30]
  ],
  "Vegetariano": [
    ["Lasagna de berenjenas y espinaca", 15, 35, 20, 30],
    ["Omelette soufflé de queso y tomates secos", 20, 20, 30, 30],
    ["Quiche de puerro y queso azul", 15, 35, 25, 25]
  ],
  "Vegano": [
    ["Curry de garbanzos y tofu", 20, 40, 15, 25],
    ["Burger de lentejas y portobello", 18, 42, 15, 25],
    ["Pad Thai de arroz y vegetales", 12, 48, 15, 25]
  ],
  "Sin TACC": [
    ["Risotto de hongos", 15, 45, 15, 25],
    ["Milanesitas con rebozado de maíz", 25, 35, 15, 25],
    ["Tarta en masa de garbanzos", 18, 37, 20, 25]
  ]
};

function singlePieChart(p, c, g, v) {
  const items = [
    { label: "Proteínas", val: p, col: "#ea4335" },
    { label: "Carbohidratos", val: c, col: "#f4a640" },
    { label: "Grasas", val: g, col: "#4285f4" },
    { label: "Verduras", val: v, col: "#34a853" }
  ];

  const cx = 170, cy = 110, r = 65;
  let currentAngle = -Math.PI / 2;
  let paths = "";

  items.forEach(item => {
    if (item.val <= 0) return;
    const sliceAngle = (item.val / 100) * (Math.PI * 2);
    const endAngle = currentAngle + sliceAngle;
    const midAngle = currentAngle + sliceAngle / 2;

    const x1 = cx + r * Math.cos(currentAngle);
    const y1 = cy + r * Math.sin(currentAngle);
    const x2 = cx + r * Math.cos(endAngle);
    const y2 = cy + r * Math.sin(endAngle);

    const largeArc = sliceAngle > Math.PI ? 1 : 0;
    const pathData = `M ${cx} ${cy} L ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z`;

    const px = cx + r * Math.cos(midAngle);
    const py = cy + r * Math.sin(midAngle);
    const ex = cx + (r + 18) * Math.cos(midAngle);
    const ey = cy + (r + 18) * Math.sin(midAngle);
    const isRight = Math.cos(midAngle) >= 0;
    const hx = ex + (isRight ? 15 : -15);
    const textAnchor = isRight ? "start" : "end";
    const tx = hx + (isRight ? 4 : -4);

    paths += `<path d="${pathData}" fill="${item.col}" stroke="#fff" stroke-width="2"/>
      <polyline points="${px.toFixed(1)},${py.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)} ${hx.toFixed(1)},${ey.toFixed(1)}" fill="none" stroke="#888" stroke-width="1"/>
      <text x="${tx.toFixed(1)}" y="${(ey - 2).toFixed(1)}" text-anchor="${textAnchor}">${item.label}</text>
      <text x="${tx.toFixed(1)}" y="${(ey + 10).toFixed(1)}" text-anchor="${textAnchor}" class="pc">${item.val}%</text>`;

    currentAngle = endAngle;
  });

  return `<svg class="pie" viewBox="0 0 340 220" style="width:100%; max-width:360px;">${paths}</svg>`;
}

function dishCard(d) {
  const [name, p, c, g, v] = d;
  return `<div class="dish">
    <strong class="dish-title">${name}</strong>
    <div class="pie-chart-container">${singlePieChart(p, c, g, v)}</div>
  </div>`;
}

function renderMenu() {
  document.getElementById("menu-list").innerHTML = TIPOS.map(t => `<div class="card"><h3>${t}</h3>${MENU[t].map(dishCard).join("")}</div>`).join("");
}
renderMenu();
</script>
<script src="db.js"></script>
</body>
